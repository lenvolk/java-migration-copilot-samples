name: modernize-pipeline

# Stage 3 of the Beat 4 demo. Starts when a human merges the modernization plan pull request.
# Plain GitHub Actions jobs do the deterministic work (branch, tests, checks).
# gh-aw agent workflows (modernize-*-analyst, -build-upgrader, -code-fixer, -conformance-reviewer)
# do the judgment work and are called as reusable workflows. Job id = workflow file name = agent name.
#
#   prepare -> [ baseline-test | modernize-compat-analyst | modernize-dependency-analyst ]  (parallel, read-only)
#           -> assessment-report -> assessment-approval              (HUMAN GATE: nothing is changed before this)
#           -> modernize-build-upgrader -> modernize-code-fixer          (sequential, one shared branch)
#           -> [ verify-build | verify-static ] -> modernize-conformance-reviewer
#           -> finalize
#
# The tracker comment is read-modify-write, so every job that writes it is ordered by `needs`
# (baseline-test -> track-analysis -> assessment-report -> assessment-approval -> modernize-build-upgrader
#  -> modernize-code-fixer -> track-build -> verify-build -> finalize).

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "docs/modernization/requests/*.md"
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Approved plan, for example docs/modernization/requests/12-asset-manager-java-upgrade.md"
        required: true
        type: string

# One pipeline per request. A second run for the same request waits instead of cancelling.
concurrency:
  group: modernize-${{ github.event.pull_request.number || inputs.plan_path }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.title, '[modernization-plan]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      issue_number: ${{ steps.plan.outputs.issue_number }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      branch: ${{ steps.plan.outputs.branch }}
      plan_path: ${{ steps.plan.outputs.plan_path }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Resolve the approved plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PLAN_PR: ${{ github.event.pull_request.number }}
          PLAN_INPUT: ${{ inputs.plan_path }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PLAN=$(gh pr view "$PLAN_PR" --json files --jq '.files[].path' | grep -E '^docs/modernization/requests/[0-9]+-.*\.md$' | head -n1 || true)
          else
            PLAN="$PLAN_INPUT"
          fi
          if ! echo "$PLAN" | grep -Eq '^docs/modernization/requests/[0-9]+-[A-Za-z0-9._-]+\.md$'; then
            echo "::error::No valid plan file found. Expected docs/modernization/requests/<issue>-*.md, got '$PLAN'."
            exit 1
          fi
          test -f "$PLAN" || { echo "::error::$PLAN is not on main."; exit 1; }
          ISSUE=$(basename "$PLAN" | grep -oE '^[0-9]+')
          echo "plan_path=$PLAN" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "branch=modernize/issue-$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Create the working branch
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          ISSUE: ${{ steps.plan.outputs.issue_number }}
          PLAN: ${{ steps.plan.outputs.plan_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists. Close the old pull request, delete the branch, then re-run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          mkdir -p "docs/modernization/runs/$ISSUE"
          printf '# Modernization run for #%s\n\n- Approved plan: `%s`\n- Pipeline run: %s\n' "$ISSUE" "$PLAN" "$RUN_URL" > "docs/modernization/runs/$ISSUE/RUN.md"
          git add docs/modernization/runs
          git commit -m "chore: start modernization run for #$ISSUE"
          git push -u origin "$BRANCH"

      - name: Open the draft Implementation Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          ISSUE: ${{ steps.plan.outputs.issue_number }}
          PLAN: ${{ steps.plan.outputs.plan_path }}
        run: |
          gh label create modernization --color 1d76db --force >/dev/null
          gh label create ready-for-human-review --color 0e8a16 --force >/dev/null
          gh label create needs-attention --color d93f0b --force >/dev/null
          cat > pr-body.md <<'BODY'
          ## Summary

          Draft. The modernization pipeline is running for issue __ISSUE__. It first assesses the code without changing it, then waits for a human to approve the assessment report. After that it pushes commits to `__BRANCH__`. The original Java 8 code stays on `main`. A reviewer agent rewrites this description when the checks finish.

          ```mermaid
          flowchart LR
              A["prepare"] --> B["baseline-test<br/>modernize-compat-analyst<br/>modernize-dependency-analyst"]
              B --> H["assessment-report<br/>assessment-approval: human"]
              H --> C["modernize-build-upgrader"]
              C --> D["modernize-code-fixer"]
              D --> E["verify-build<br/>verify-static"]
              E --> F["modernize-conformance-reviewer"]
              F --> G["finalize: human review"]
          ```

          ## Evidence

          - **Before:** `main` is Java 8 and Spring Boot 2.7.18. Approved plan: `__PLAN__`.
            **After:** pending. The status comment below shows each stage as it finishes.

          ## Merge Danger

          **Door:** two-way. Nothing on `main` has changed.

          Do not merge while this pull request is a draft.

          **Blast Radius:** None

          Closes #__ISSUE__
          BODY
          sed -i "s|__ISSUE__|$ISSUE|g; s|__BRANCH__|$BRANCH|g; s|__PLAN__|$PLAN|g" pr-body.md
          gh pr create --draft --base main --head "$BRANCH" --label modernization \
            --title "[modernization] Upgrade Asset Manager to Java 21 and Spring Boot 3.5 (#$ISSUE)" \
            --body-file pr-body.md
          echo "pr_number=$(gh pr view "$BRANCH" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      - name: Start the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr_number }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Plan approved" --status done --detail "Plan merged (approved) by @$ACTOR" --run-url "$RUN_URL"

  baseline-test:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      tests: ${{ steps.summary.outputs.tests }}
      failures: ${{ steps.summary.outputs.failures }}
      errors: ${{ steps.summary.outputs.errors }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: asset-manager/**/pom.xml
      - name: Run the baseline tests
        working-directory: asset-manager
        run: ./mvnw -B -ntp test -Dmaven.test.failure.ignore=true
      - name: Summarize
        id: summary
        run: python3 .github/scripts/surefire_summary.py asset-manager | tee -a "$GITHUB_OUTPUT"
      - name: Record the baseline in the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
          DETAIL: "${{ steps.summary.outputs.tests }} tests, ${{ steps.summary.outputs.failures }} failures, ${{ steps.summary.outputs.errors }} errors (JDK 8, main)"
        run: python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Baseline tests" --status done --detail "$DETAIL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-test-reports
          path: asset-manager/**/target/surefire-reports/
          if-no-files-found: ignore

  modernize-compat-analyst:
    needs: prepare
    uses: ./.github/workflows/modernize-compat-analyst.lock.yml
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      branch: ${{ needs.prepare.outputs.branch }}
      plan_path: ${{ needs.prepare.outputs.plan_path }}
    secrets: inherit

  modernize-dependency-analyst:
    needs: prepare
    uses: ./.github/workflows/modernize-dependency-analyst.lock.yml
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      branch: ${{ needs.prepare.outputs.branch }}
      plan_path: ${{ needs.prepare.outputs.plan_path }}
    secrets: inherit

  track-analysis:
    needs: [prepare, baseline-test, modernize-compat-analyst, modernize-dependency-analyst]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
          COMPAT: ${{ needs.modernize-compat-analyst.result }}
          DEPS: ${{ needs.modernize-dependency-analyst.result }}
        run: |
          s() { if [ "$1" = "success" ]; then echo done; else echo failed; fi; }
          python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Compatibility analysis" --status "$(s "$COMPAT")" --detail "Comment on the PR from modernize-compat-analyst"
          python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Dependency analysis" --status "$(s "$DEPS")" --detail "Comment on the PR from modernize-dependency-analyst"

  assessment-report:
    needs: [prepare, baseline-test, modernize-compat-analyst, modernize-dependency-analyst, track-analysis]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Confirm the approval gate requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub creates a missing environment on first use with no protection, which would skip the pause.
          set +e
          OUT=$(gh api "repos/$GITHUB_REPOSITORY/environments/assessment-review" --jq '[.protection_rules[]? | select(.type == "required_reviewer" or .type == "required_reviewers")] | length' 2>&1)
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            case "$OUT" in
              *404*|*"Not Found"*) echo "::error::Environment assessment-review does not exist, so the gate would not pause. Run demo/beat4/setup.ps1."; exit 1 ;;
              *) echo "::warning::Could not read the assessment-review environment ($OUT). Confirm it requires a reviewer."; exit 0 ;;
            esac
          fi
          if [ "$OUT" = "0" ]; then
            echo "::error::Environment assessment-review has no required reviewer, so the gate would not pause. Run demo/beat4/setup.ps1."
            exit 1
          fi
      - name: Build the assessment report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
          PLAN: ${{ needs.prepare.outputs.plan_path }}
          TESTS: ${{ needs.baseline-test.outputs.tests }}
          FAILURES: ${{ needs.baseline-test.outputs.failures }}
          ERRORS: ${{ needs.baseline-test.outputs.errors }}
        run: python3 .github/scripts/modernize_assessment.py build --pr "$PR" --plan "$PLAN" --tests "$TESTS" --failures "$FAILURES" --errors "$ERRORS" --out assessment-report.md
      - name: Ask for approval in the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
        run: python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Assessment review" --status attention --detail "Waiting for a human. Open the run and select Review deployments"
      - uses: actions/upload-artifact@v4
        with:
          name: assessment-report
          path: assessment-report.md

  # HUMAN GATE. The environment requires a reviewer, so this job waits until one approves in the Actions run.
  assessment-approval:
    needs: [prepare, assessment-report]
    runs-on: ubuntu-latest
    environment: assessment-review
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Record the approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
        run: |
          APPROVER=$(python3 .github/scripts/modernize_assessment.py approve --pr "$PR")
          python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Assessment review" --status done --detail "Approved by $APPROVER"

  modernize-build-upgrader:
    needs: [prepare, baseline-test, modernize-compat-analyst, modernize-dependency-analyst, track-analysis, assessment-approval]
    uses: ./.github/workflows/modernize-build-upgrader.lock.yml
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      branch: ${{ needs.prepare.outputs.branch }}
      plan_path: ${{ needs.prepare.outputs.plan_path }}
    secrets: inherit

  modernize-code-fixer:
    needs: [prepare, modernize-build-upgrader]
    uses: ./.github/workflows/modernize-code-fixer.lock.yml
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      branch: ${{ needs.prepare.outputs.branch }}
      plan_path: ${{ needs.prepare.outputs.plan_path }}
    secrets: inherit

  track-build:
    needs: [prepare, modernize-build-upgrader, modernize-code-fixer]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
          UPGRADE: ${{ needs.modernize-build-upgrader.result }}
          CODEFIX: ${{ needs.modernize-code-fixer.result }}
        run: |
          s() { if [ "$1" = "success" ]; then echo done; else echo failed; fi; }
          python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Build upgrade" --status "$(s "$UPGRADE")" --detail "Commit pushed by modernize-build-upgrader"
          python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Code fixes" --status "$(s "$CODEFIX")" --detail "Commits pushed by modernize-code-fixer"

  verify-build:
    needs: [prepare, baseline-test, modernize-code-fixer, track-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
      - uses: actions/checkout@v5
        with:
          ref: main
          path: main-scripts
          sparse-checkout: .github/scripts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: asset-manager/**/pom.xml
      - name: Build, test, and package
        working-directory: asset-manager
        run: |
          ./mvnw -B -ntp clean test -Dmaven.test.failure.ignore=true
          ./mvnw -B -ntp -DskipTests package
          ls web/target/*.jar worker/target/*.jar
      - name: Summarize and compare with the baseline
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
          BASE_TESTS: ${{ needs.baseline-test.outputs.tests }}
          BASE_FAIL: ${{ needs.baseline-test.outputs.failures }}
          BASE_ERR: ${{ needs.baseline-test.outputs.errors }}
        run: |
          python3 main-scripts/.github/scripts/surefire_summary.py asset-manager | tee summary.txt
          T=$(grep '^tests=' summary.txt | cut -d= -f2); F=$(grep '^failures=' summary.txt | cut -d= -f2); E=$(grep '^errors=' summary.txt | cut -d= -f2)
          DETAIL="JDK 21: $T tests, $F failures, $E errors. Baseline: $BASE_TESTS tests, $BASE_FAIL failures, $BASE_ERR errors."
          if [ $((F + E)) -le $((BASE_FAIL + BASE_ERR)) ] && [ "$T" -ge "$BASE_TESTS" ]; then STATUS=done; else STATUS=failed; fi
          python3 main-scripts/.github/scripts/modernize_tracker.py --pr "$PR" --stage "Build and test verification" --status "$STATUS" --detail "$DETAIL"
          echo "$DETAIL"
          [ "$STATUS" = "done" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-test-reports
          path: asset-manager/**/target/surefire-reports/
          if-no-files-found: ignore

  verify-static:
    needs: [prepare, modernize-code-fixer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
      - name: Check versions and Jakarta namespaces
        run: |
          fail=0
          BOOT=$(sed -n '/<artifactId>spring-boot-starter-parent<\/artifactId>/,/<\/parent>/p' asset-manager/pom.xml | grep -oE '<version>[^<]+' | head -n1 | cut -d'>' -f2)
          JAVA=$(grep -oE '<java.version>[^<]+' asset-manager/pom.xml | head -n1 | cut -d'>' -f2)
          echo "Spring Boot parent: $BOOT, java.version: $JAVA"
          case "$BOOT" in 3.5.*) ;; *) echo "::error::Spring Boot parent must be 3.5.x"; fail=1 ;; esac
          [ "$JAVA" = "21" ] || { echo "::error::java.version must be 21"; fail=1; }
          if grep -rnE --include='*.java' 'import javax\.(persistence|annotation|servlet|validation)' asset-manager; then
            echo "::error::Remaining javax imports must be jakarta"; fail=1
          fi
          # javax.imageio ships in the JDK and must stay unchanged
          grep -rq --include='*.java' 'import jakarta\.imageio' asset-manager && { echo "::error::javax.imageio must not be renamed"; fail=1; }
          exit $fail

  modernize-conformance-reviewer:
    needs: [prepare, modernize-code-fixer, verify-build, verify-static]
    if: always() && needs.prepare.result == 'success' && needs.modernize-code-fixer.result == 'success'
    uses: ./.github/workflows/modernize-conformance-reviewer.lock.yml
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      branch: ${{ needs.prepare.outputs.branch }}
      plan_path: ${{ needs.prepare.outputs.plan_path }}
    secrets: inherit

  finalize:
    needs: [prepare, assessment-approval, verify-build, verify-static, modernize-conformance-reviewer]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Mark ready or flag attention
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.prepare.outputs.pr_number }}
          APPROVAL: ${{ needs.assessment-approval.result }}
          BUILD: ${{ needs.verify-build.result }}
          STATIC: ${{ needs.verify-static.result }}
          REVIEW: ${{ needs.modernize-conformance-reviewer.result }}
        run: |
          gh label create ready-for-human-review --color 0e8a16 --force >/dev/null
          gh label create needs-attention --color d93f0b --force >/dev/null
          if [ "$BUILD" = "success" ] && [ "$STATIC" = "success" ] && [ "$REVIEW" = "success" ]; then
            gh pr ready "$PR"
            gh pr edit "$PR" --add-label ready-for-human-review
            python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Plan-conformance review" --status done --detail "Comment on the PR from modernize-conformance-reviewer"
            python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Human review" --status attention --detail "Ready: review the pull request and merge when satisfied"
          else
            gh pr edit "$PR" --add-label needs-attention
            if [ "$APPROVAL" = "failure" ] || [ "$APPROVAL" = "cancelled" ]; then
              python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Assessment review" --status failed --detail "Not approved. No application file was changed"
            fi
            python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Plan-conformance review" --status failed --detail "Review result: $REVIEW"
            python3 .github/scripts/modernize_tracker.py --pr "$PR" --stage "Human review" --status failed --detail "Not ready. Re-run the failed stage from the Actions run."
            echo "::error::Pipeline is not green (approval=$APPROVAL build=$BUILD static=$STATIC review=$REVIEW)."
            exit 1
          fi
